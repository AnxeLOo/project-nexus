<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0D12"/>
      <stop offset="50%" stop-color="#171421"/>
      <stop offset="100%" stop-color="#0E0D12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EADDFF"/>
      <stop offset="50%" stop-color="#D0BCFF"/>
      <stop offset="100%" stop-color="#7F5AF0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23202A"/>
      <stop offset="100%" stop-color="#1B1920"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F5AF0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7F5AF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
